name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build-test-eval:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Run eval against production server
        run: |
          # setsid puts the server in its own process group so the trap
          # kills npm AND the next-server child it spawns.
          setsid npm run start -- -p 3000 > /tmp/next-start.log 2>&1 < /dev/null &
          SERVER_PID=$!
          cleanup() {
            kill -- -$SERVER_PID 2>/dev/null || true
          }
          trap cleanup EXIT
          echo "Waiting for the production server on http://localhost:3000 ..."
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/ > /dev/null 2>&1; then
              echo "Server is up."
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:3000/ > /dev/null
          BASE_URL=http://localhost:3000 npm run eval
