# Lumen Hair Studio on Kubernetes — Deployment + Service.
# Applied by kubectl (`kubectl apply -f k8s/`) or by the Terraform in
# infra/terraform (same image, replicas, probes and resource limits —
# keep the two in sync).
#
# Image: built locally from this repo's Dockerfile and loaded into
# kind with `kind load docker-image lumen-salon:test --name lumen-salon`,
# so imagePullPolicy is Never — kind has no registry to pull from.
# A real cluster would use a tagged image from a registry and
# imagePullPolicy: IfNotPresent.
apiVersion: v1
kind: Namespace
metadata:
  name: lumen
  labels:
    app.kubernetes.io/name: lumen-salon
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lumen-salon
  namespace: lumen
  labels:
    app.kubernetes.io/name: lumen-salon
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: lumen-salon
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lumen-salon
    spec:
      containers:
        - name: lumen-salon
          image: lumen-salon:test
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
              name: http
          # Small requests/limits: 3 replicas must fit on a laptop
          # kind cluster (1 control-plane + 2 workers).
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # /api/health answers 200 with the pod hostname (see
          # app/api/health/route.ts): the probes use it, and curling
          # it repeatedly shows load balancing across replicas.
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: lumen-salon
  namespace: lumen
  labels:
    app.kubernetes.io/name: lumen-salon
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: lumen-salon
  ports:
    - port: 80
      targetPort: http
